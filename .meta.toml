# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[meta]
template = "pure-python"
commit-id = "1f2c8437"

[python]
with-pypy = true
with-sphinx-doctests = false
with-windows = false
with-future-python = true
with-macos = false
with-docs = false
with-free-threaded-python = false

[tox]
use-flake8 = true
testenv-additional-extras = [
    "!pypy3: bcrypt",
    ]
testenv-deps = [
    "pytest",
    "pytest-cov",
    ]
testenv-commands = [
    "pytest src",
    ]
coverage-command = "py.test --cov=src src"

[coverage]
fail-under = 90

[pypi]
trusted-publishing = true
